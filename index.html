<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma To-Do</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f7; --surface-3:#e8ebf2; --border:#e2e5ee;
  --text:#1b2232; --muted:#6a7286; --faint:#9aa1b2;
  --accent:#4f63e8; --accent-bg:#eaedfd;
  --danger:#d43a4a; --danger-bg:#fdecee; --warn:#c77d0e; --warn-bg:#fdf3e1; --ok:#23915f; --ok-bg:#e3f5ec;
  --p1:#e5484d; --p1-bg:#fde9ea; --p2:#e9971a; --p2-bg:#fdf1dd; --p3:#5876b8; --p3-bg:#e7edf8; --p0:#9aa1b2; --p0-bg:#eef0f4;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 6px 18px rgba(20,30,60,.05);
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#191d27; --surface-2:#202533; --surface-3:#2a3040; --border:#2b3142;
    --text:#e6e9f0; --muted:#9aa2b5; --faint:#6b7386;
    --accent:#7d8cff; --accent-bg:#252b4a;
    --danger:#ff6b78; --danger-bg:#3a1f25; --warn:#f2b052; --warn-bg:#3a2e1a; --ok:#4cc98d; --ok-bg:#1a3328;
    --p1:#ff6369; --p1-bg:#3b1e22; --p2:#f5ab3c; --p2-bg:#3a2d18; --p3:#7f9be0; --p3-bg:#1f2a42; --p0:#7b8396; --p0-bg:#252a36;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191d27; --surface-2:#202533; --surface-3:#2a3040; --border:#2b3142;
  --text:#e6e9f0; --muted:#9aa2b5; --faint:#6b7386;
  --accent:#7d8cff; --accent-bg:#252b4a;
  --danger:#ff6b78; --danger-bg:#3a1f25; --warn:#f2b052; --warn-bg:#3a2e1a; --ok:#4cc98d; --ok-bg:#1a3328;
  --p1:#ff6369; --p1-bg:#3b1e22; --p2:#f5ab3c; --p2-bg:#3a2d18; --p3:#7f9be0; --p3-bg:#1f2a42; --p0:#7b8396; --p0-bg:#252a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
select,input,textarea{max-width:100%;min-width:0}
select{text-overflow:ellipsis}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inline:focus-visible,.search:focus-visible,.f :focus-visible{outline:0}
button,a,.chip,.pill,.stat{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;scroll-behavior:auto!important}}
button{cursor:pointer}
.app{display:flex;min-height:100vh}

/* Barre latérale */
.side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:17px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--accent-bg);color:var(--accent)}
.nav a .n{margin-left:auto;font-size:12px;background:var(--surface-3);color:var(--muted);border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.nav a .n.red{background:var(--danger-bg);color:var(--danger)}
.nav svg{width:17px;height:17px;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.theme{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px}
.theme button{flex:1;border:0;background:none;border-radius:6px;padding:4px 0;font-size:12px;color:var(--muted)}
.theme button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* Zone principale */
.main{flex:1;min-width:0;padding:22px 28px 80px;max-width:1180px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.qa{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow);margin-bottom:20px}
.qa input[type=text]{flex:1 1 260px;min-width:0;border:0;background:none;padding:8px 10px;outline:none;font-size:15px}
.qa select,.qa input[type=date]{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.qa select{flex:0 1 240px}
.qa .plus{display:none}
.chips{display:flex;gap:4px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}

/* Cartes chiffres */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--text);text-decoration:none;min-width:0}
.stat:hover{border-color:var(--accent)}
.stat:active{background:var(--surface-2)}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{color:var(--muted);font-size:12px}
.stat.late .v{color:var(--danger)}
.stat.today .v{color:var(--accent)}

/* Filtres : toujours visibles sur grand écran, repliés derrière un bouton sur téléphone */
.filt-tog{display:none}
.filt-tog svg{width:15px;height:15px}
.filt-tog .n{font-size:12px;background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.filt-tog .chev{display:inline-flex;color:var(--faint);transition:transform .15s}
.filt.open .filt-tog .chev{transform:rotate(90deg)}

/* Sections du dashboard */
details.sec{margin-bottom:14px;scroll-margin-top:72px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 2px;font-weight:600;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .chev{transition:transform .15s;color:var(--faint)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec>summary .cnt{font-size:12px;color:var(--muted);background:var(--surface-3);border-radius:10px;padding:0 8px;font-weight:500}
details.sec>summary .load{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.sec-late>summary{color:var(--danger)}
.sec-today>summary{color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.empty{color:var(--faint);padding:14px 16px;font-size:13px}

/* Ligne de tâche */
.task{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;border-top:1px solid var(--border);position:relative;flex-wrap:wrap}
.task:first-child{border-top:0}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc,transparent)}
.task:hover{background:var(--surface-2)}
.task.closed .title{text-decoration:line-through;color:var(--faint)}
.task.st-cancelled{opacity:.65}
.chk{width:17px;height:17px;accent-color:var(--ok);margin:0;flex:none;cursor:pointer}
.inline{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;outline:none;min-width:0}
.inline:hover{border-color:var(--border)}
.inline:focus{border-color:var(--accent);background:var(--surface)}
.task .title{flex:1 1 240px;font-size:14px}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.subj-sel{max-width:190px;border:1px solid transparent;background:var(--sp-bg,var(--surface-2));color:var(--sp,var(--muted));border-radius:20px;padding:3px 8px;font-size:12px;font-weight:500}
.subj-sel:hover{border-color:var(--border)}
.pill{border:1px solid transparent;border-radius:20px;padding:3px 8px;font-size:12px;font-weight:500;appearance:none;-webkit-appearance:none;text-align:center;cursor:pointer}
.pill:hover{border-color:var(--border)}
.s-todo{background:var(--surface-3);color:var(--muted)}
.s-doing{background:var(--accent-bg);color:var(--accent)}
.s-waiting{background:var(--warn-bg);color:var(--warn)}
.s-done{background:var(--ok-bg);color:var(--ok)}
.s-cancelled{background:var(--surface-3);color:var(--faint)}
.s-empty{background:var(--surface-2);color:var(--faint)}
.prog{display:inline-flex;align-items:center;font-size:12px;color:var(--accent)}
.prog input{width:46px;border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 4px;text-align:right}
.est{width:62px;font-size:12px;color:var(--muted);text-align:right}
.date-wrap{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:8px;padding:0 4px 0 2px}
.date-wrap .rel{min-width:64px;color:var(--muted)}
.date{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;font-size:12px;color:var(--muted);width:120px}
.date:hover{border-color:var(--border)}
.date:focus{border-color:var(--accent);outline:none}
.d-late .rel,.d-late .date{color:var(--danger);font-weight:600}
.d-today .rel,.d-today .date{color:var(--accent);font-weight:600}
.d-tomorrow .rel{color:var(--warn)}
.icon{border:0;background:none;color:var(--faint);border-radius:6px;padding:4px 6px;font-size:12px;line-height:1;display:inline-flex;align-items:center}
.icon:hover{background:var(--surface-3);color:var(--text)}
.icon svg{width:15px;height:15px}

/* Page sujets */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;outline:none}
.search:focus{border-color:var(--accent)}
.tog{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.prio-group{margin-bottom:20px}
.prio-title{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px 2px}
.prio-title .sw{width:10px;height:10px;border-radius:3px;background:var(--pc)}
.subject{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden;border-left:4px solid var(--pc)}
.s-head{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.s-head .chev{border:0;background:none;color:var(--faint);padding:4px;border-radius:6px;transition:transform .15s;display:inline-flex}
.s-head .chev:hover{background:var(--surface-2)}
.subject.open > .s-head .chev{transform:rotate(90deg)}
.s-head .stitle{flex:1 1 220px;font-weight:600;font-size:15px}
.prio-sel{background:var(--pbg);color:var(--pc);font-weight:700}
.bar{width:90px;height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.s-info{font-size:12px;color:var(--muted);display:inline-flex;gap:10px;align-items:center}
.s-info .late{color:var(--danger);font-weight:600}
.s-body{border-top:1px solid var(--border);background:var(--surface)}
.dims-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.dims-bar .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.dims-bar select{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:12px;outline:none;max-width:200px}
.dims-bar select.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.dims-bar .clear{border:0;background:none;color:var(--accent);font-size:12px;text-decoration:underline;cursor:pointer}
.s-dims{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px 0;background:var(--surface-2)}
.s-dims label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.s-dims input{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px;width:130px;outline:none}
.s-dims input:focus{border-color:var(--accent)}
.s-tags{font-size:11px;color:var(--faint);white-space:nowrap}
.s-desc{width:100%;border:0;border-bottom:1px solid var(--border);background:var(--surface-2);padding:8px 14px;resize:vertical;min-height:34px;outline:none;font-size:13px;color:var(--muted)}
.addrow{display:flex;gap:6px;align-items:center;padding:6px 10px 8px 12px;border-top:1px dashed var(--border);flex-wrap:wrap}
.addrow input[type=text]{flex:1 1 200px;border:0;background:none;padding:6px;outline:none}
.addrow input[type=text]::placeholder{color:var(--faint)}
.addrow .date{width:130px}
.addrow .est{width:70px;border:1px solid var(--border)}
.closed-head{font-size:12px;color:var(--faint);padding:6px 14px;border-top:1px solid var(--border);background:var(--surface-2)}
/* Sous-sujets : cartes imbriquées dans le corps du parent */
.s-children{padding:8px 10px 10px 18px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.s-children .subject.child{margin:0;box-shadow:none;border-left-width:3px}
.subject.child .s-head{padding:6px 8px}
.subject.child .s-head .stitle{font-size:14px;flex-basis:180px}
.s-addchild{align-self:flex-start;font-size:12px;padding:4px 10px;background:var(--surface);color:var(--muted)}
.s-addchild:hover{color:var(--accent);border-color:var(--accent)}
.s-dims select{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px;max-width:220px;outline:none}
.s-dims select:focus{border-color:var(--accent)}
.s-kids{font-size:12px;color:var(--muted);align-self:center}
.s-kidn{display:inline-flex;align-items:center;gap:3px}
@media (max-width:760px){.s-children{padding-left:8px}}

/* Panneau détails */
.drawer-bg{position:fixed;inset:0;background:rgba(10,15,30,.25);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:21;padding:18px 20px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.drawer h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.drawer h2 .x{margin-left:auto}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;min-width:0;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:7px 9px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--faint)}
.drawer .ts{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.7}

/* Données */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:0 0 12px;color:var(--muted)}
/* Modules actifs (onglet Données) */
.mods{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mod{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:56px;cursor:pointer;border-top:1px solid var(--border);background:var(--surface)}
.mod:first-child{border-top:0}
.mod:hover{background:var(--surface-2)}
.mod.soon{cursor:default;background:var(--surface)}
.mod-ic{width:32px;height:32px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.mod.on .mod-ic{background:var(--accent-bg);color:var(--accent)}
.mod-ic svg{width:17px;height:17px}
.mod-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mod-t b{font-weight:600}
.mod-t .hint{line-height:1.4}
.mod-st{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.mod.on .mod-st{color:var(--accent)}
.mod-soon{display:inline-block;vertical-align:1px;margin-left:6px;font-size:11px;font-weight:600;border-radius:10px;padding:1px 8px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:24px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch::before{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent);border-color:var(--accent)}
.switch:checked::before{transform:translateX(16px)}
.switch:disabled{opacity:.5;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){.switch,.switch::before{transition:none}}
@media (max-width:760px){.mod-st{display:none}}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;z-index:30;box-shadow:var(--shadow);font-size:13px}
.hist{margin-left:auto;display:flex;gap:2px}
.hist-b{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;padding:0}
.hist-b svg{width:17px;height:17px}
.hist-b:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.hist-b:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hist-b:disabled{opacity:.35;cursor:not-allowed}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-bg)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flash 1.5s ease-out;border-radius:8px}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}

@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:10;flex-direction:row;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));border-right:0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand{padding:0 6px 0 2px}
  .brand span{display:none}
  .hist{margin-left:2px}
  .hist-b{width:40px;height:44px}
  .hist-b svg{width:20px;height:20px}
  .nav{display:flex;gap:2px;flex:1;justify-content:space-between}
  .nav a{padding:0 8px;min-height:44px;min-width:44px;justify-content:center;gap:6px;white-space:nowrap}
  .nav a .lbl{display:none}
  .nav a .n{margin-left:0}
  .nav svg{width:20px;height:20px}
  .side .foot{display:none}
  .main{padding:14px 12px 80px;padding-bottom:max(80px,calc(64px + env(safe-area-inset-bottom)))}
  h1{font-size:20px}
  .sub{margin-bottom:12px}
  /* Saisie rapide compacte : titre et sujet sur toute la largeur, puis date et bouton */
  .qa{padding:6px;gap:6px;margin-bottom:12px}
  .qa input[type=text]{flex:1 1 100%;font-size:16px;padding:8px}
  .qa select{flex:1 1 100%}
  .qa .chip{padding:6px 9px}

<script>
(function(){
'use strict';

/* ---------- Outils ---------- */
// Mode démo (index.html?demo) : données d'exemple rangées dans le stockage de l'onglet,
// les vraies données (localStorage) ne sont pas modifiées, synchro et sauvegarde auto coupées
const DEMO = new URLSearchParams(location.search).has('demo') && !!window.todoDemo;
const REAL_KEY = 'todo-noel-v1';
const KEY = DEMO ? 'todo-noel-demo' : REAL_KEY;
const BACKUP_KEY = DEMO ? 'todo-noel-demo-avant-import' : 'todo-noel-v1-avant-import';
const store = DEMO ? sessionStorage : localStorage;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M = window.todoMetier;
const { uid, nowIso } = M;
const { pad, ymd, parseYmd, addDays, isDate } = M;
const today = () => ymd(new Date());
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 86400000);

// Durées : "1h30", "45min", "2" (= heures), "1j" (= une journée de travail des réglages)
const parseDur = v => M.parseDur(v, db.settings.workdayMin);
function fmtDur(min) {
  if (min == null || isNaN(min)) return '';
  if (min < 60) return min + 'min';
  const h = Math.floor(min / 60), m = min % 60;
  return h + 'h' + (m ? pad(m) : '');
}
function relDate(d) {
  if (!d) return '';
  const n = diffDays(d, today());
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'demain';
  if (n === -1) return 'hier';
  if (n < 0) return `retard ${-n} j`;
  if (n < 7) return parseYmd(d).toLocaleDateString('fr-FR', { weekday: 'long' });
  return `dans ${n} j`;
}
function longDate(d) {
  return parseYmd(d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

const STATUS = { todo: 'À faire', doing: 'En cours', waiting: 'En attente', done: 'Fait', cancelled: 'Annulé' };
// Paramètres d'un sujet repris de l'Excel, utilisés pour filtrer partout (tableau de bord, sujets, charge)
const DIMS = { code: 'Code', secteur: 'Secteur', produit: 'Produit fini' };
const PRIO = {
  1: { short: 'P1', name: 'Variable', desc: 'Impacte ma rémunération variable' },
  2: { short: 'P2', name: 'Important', desc: 'Sujets importants' },
  3: { short: 'P3', name: 'Standard', desc: 'Sujets standards' }
};
const ICON = {
  dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
  archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></svg>',
  data: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="7"/><path d="M12 10.5V14l2 1.5M10 3h4M12 3v4"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  gantt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v16h18"/><rect x="6" y="6" width="7" height="3" rx="1"/><rect x="10" y="11" width="8" height="3" rx="1"/><rect x="8" y="16" width="5" height="2" rx="1"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>',
  restore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
};

/* ---------- Modules activables ---------- */
// Chaque module peut être masqué dans Données › Modules actifs. Masquer ne supprime rien :
// les données restent (et restent synchronisées), elles reviennent quand on le réactive.
// soon : module prévu mais pas encore construit (interrupteur grisé)
const MODULES = [
  { id: 'chrono', label: 'Chrono et temps passé', icon: 'timer', desc: 'Bouton ▶ sur chaque tâche, temps réel passé et historique dans les détails.' },
  { id: 'charge', label: 'Charge de travail', icon: 'chart', desc: 'Onglet Charge (prévision jour par jour, créneaux fixes), mini graphique du tableau de bord, date de début et répartition dans les détails.' },
  { id: 'pointage', label: 'Pointage et congés', icon: 'clock', desc: 'Onglet Pointage (heures, absences, compteurs de congés) et bandeau du tableau de bord. Les congés réduisent la capacité de la Charge.' },
  { id: 'recurrence', label: 'Tâches récurrentes', icon: 'repeat', desc: 'Option « Répéter » dans les détails : la tâche suivante se crée toute seule.' },
  { id: 'projet', label: 'Gestion de projet', icon: 'gantt', def: false, desc: 'Étapes reliées entre elles, planning type Gantt et vue d\'avancement pour l\'équipe.' }
];
function modOn(id) {
  const m = MODULES.find(x => x.id === id);
  if (!m) return true;
  if (m.soon) return false;
  const v = (db.settings.modules || {})[id];
  return v == null ? m.def !== false : !!v;
}
// Un onglet peut appartenir à un module : 4e case de NAV
const navOn = n => !n[3] || modOn(n[3]);

/* ---------- Données ---------- */
const { blank, normSubject, normTask, migrate } = M;
function load() {
  const s = store.getItem(KEY);
  if (s) {
    try { return migrate(JSON.parse(s)); } catch (e) {
      console.error(e);
      // Données illisibles : on garde une copie brute avant que le prochain enregistrement ne l'écrase
      const rescue = KEY + '-illisible-' + nowIso().replace(/[:.]/g, '-');
      let kept = false;
      try { store.setItem(rescue, s); kept = true; } catch (e2) {}
      alert("Les données de ce navigateur n'ont pas pu être relues.\n\n" +
        (kept ? `Une copie brute est gardée dans le navigateur (clé « ${rescue} »).\n` : '') +
        "Si la synchro GitHub est active, la dernière version va être récupérée automatiquement. Sinon, restaure ta dernière sauvegarde (Données › Restaurer).");
    }
  }
  return DEMO ? demoData() : blank();
}
// Point de retour « avant import » : une seule copie, datée
function keepBackup() {
  store.setItem(BACKUP_KEY, JSON.stringify(db));
  try { store.setItem(BACKUP_KEY + '-date', nowIso()); } catch (e) {}
}
function dropBackup() {
  store.removeItem(BACKUP_KEY);
  store.removeItem(BACKUP_KEY + '-date');
}
function demoData() {
  const d = migrate(window.todoDemo.data(today()));
  // Garde le thème choisi dans l'appli
  try { d.settings.theme = JSON.parse(localStorage.getItem(REAL_KEY)).settings.theme || 'auto'; } catch (e) {}
  return d;
}
const demoUrl = on => location.pathname + (on ? '?demo' : '') + location.hash;
function startDemo() {
  try { sessionStorage.removeItem('todo-noel-demo'); sessionStorage.removeItem('todo-noel-demo-avant-import'); } catch (e) {}
  location.href = demoUrl(true);
}
function exitDemo() {
  try { sessionStorage.removeItem(KEY); sessionStorage.removeItem(BACKUP_KEY); } catch (e) {}
  location.href = demoUrl(false);
}
let db = load();
let lastSaved = null;
// Photo des données telles que l'historique les connaît. Un enregistrement qui ne passe pas par modifier()
// (module pas encore migré) et change les données vide l'historique : un Ctrl+Z ne pourra pas l'effacer.
let photoConnue = null, dansModif = false;
function save() {
  if (!dansModif && photoConnue !== null && M.photo(db) !== photoConnue) viderHistorique();
  try {
    store.setItem(KEY, JSON.stringify(db));
    lastSaved = new Date();
    if (!dansModif) photoConnue = M.photo(db);
    window.dispatchEvent(new Event('todo:saved'));
  } catch (e) {
    alert("Impossible d'enregistrer dans le navigateur : " + e.message + "\nFais un export JSON pour ne rien perdre.");
  }
}
window.addEventListener('storage', e => { if (e.key === KEY) { db = load(); viderHistorique(); render(); } });

const subj = id => id ? db.subjects.find(s => s.id === id) : null;
const task = id => db.tasks.find(t => t.id === id);
const isOpen = M.isOpen;
// Une tâche est visible si elle n'est pas archivée et que son sujet ne l'est pas non plus
const visible = t => !t.archived && !(subj(t.subjectId)?.archived);
const activeSubjects = () => db.subjects.filter(s => !s.archived)
  .sort((a, b) => a.priority - b.priority || a.title.localeCompare(b.title, 'fr'));
// Sous-sujets : un seul niveau. Un parent introuvable ou lui-même rangé ailleurs ne compte pas (le sujet reste au premier niveau).
const parentOf = s => M.parentOf(s, db);
// Premier niveau à l'affichage : sans parent, ou dont le parent est archivé (sous-sujet restauré seul)
const isTop = s => { const p = parentOf(s); return !p || p.archived; };
const childrenOf = (s, all) => M.childrenOf(s, db, all);
const subjLabel = s => s ? (parentOf(s) ? parentOf(s).title + ' › ' : '') + (s.title || 'Sans titre') : '';
// Peut devenir sous-sujet : pas de sous-sujets à lui (même archivés), pas en mode projet ; la cible est de premier niveau
const canBeChild = s => !childrenOf(s, true).length && !db.subjects.some(x => x.parentId === s.id && x !== s) && !s.isProject;
const canNest = (s, np) => np !== s && !np.parentId && !np.archived && canBeChild(s);
// Change le parent d'un sujet ; une étape qui quitte son parent perd ses liens de planning
function setParent(s, pid) {
  const np = pid ? subj(pid) : null;
  if (np && !canNest(s, np)) return false;
  const old = parentOf(s);
  if ((old && old.id) === (np && np.id)) return false;
  if (old) {
    childrenOf(old, true).forEach(x => { if (Array.isArray(x.after)) x.after = x.after.filter(id => id !== s.id); });
    ((old.pj && old.pj.milestones) || []).forEach(m => { if (Array.isArray(m.before)) m.before = m.before.filter(id => id !== s.id); });
    s.after = []; s.lagDays = 0;
  }
  s.parentId = np ? np.id : null;
  if (np) expandTo(s.id);
  return true;
}
// Déplie un sujet et son parent
function expandTo(sid) {
  const s = subj(sid), ex = new Set(db.ui.expanded);
  if (!s) return;
  ex.add(s.id);
  if (parentOf(s)) ex.add(parentOf(s).id);
  db.ui.expanded = [...ex];
}

// Filtre Code / Secteur / Produit fini, commun à toutes les pages
const dimVal = (s, k) => (s && s[k] || '').trim();
const dimsActive = () => Object.keys(DIMS).some(k => db.ui.dims[k]);
const dimOkOne = s => Object.keys(DIMS).every(k => !db.ui.dims[k] || dimVal(s, k) === db.ui.dims[k]);
const dimOkSubject = s => !!s && (dimOkOne(s) || childrenOf(s).some(dimOkOne));
// Une tâche passe si son sujet correspond, ou, pour un sous-sujet, si son parent correspond (comme dans l'onglet Sujets)
const dimOk = t => { const s = subj(t.subjectId); return !dimsActive() || !!s && (dimOkOne(s) || (!isTop(s) && dimOkOne(parentOf(s)))); };
function dimValues(k) {
  return [...new Set(db.subjects.filter(s => !s.archived).map(s => dimVal(s, k)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
}
function dimsBar() {
  const sel = Object.entries(DIMS).map(([k, l]) => {
    const vals = dimValues(k), v = db.ui.dims[k];
    if (!vals.length && !v) return '';
    return `<select data-dim="${k}" data-k="dim-${k}" class="${v ? 'on' : ''}" title="Filtrer par ${l.toLowerCase()}">
      <option value="">${l} : tous</option>${vals.map(x => `<option value="${esc(x)}" ${x === v ? 'selected' : ''}>${l} : ${esc(x)}</option>`).join('')}</select>`;
  }).join('');
  if (!sel) return '';
  return `<div class="dims-bar"><span class="lbl">Filtrer :</span>${sel}${dimsActive() ? '<button type="button" class="clear" data-act="dims-clear">Tout afficher</button>' : ''}</div>`;
}

const bucket = t => M.bucket(t, today());
const taskCmp = (a, b) => M.taskCmp(db)(a, b);   // pour les modules ; la page trie avec M.taskCmp(db)

// État d'un sujet déduit de ses tâches (règle dans metier.js)
const subjectStats = s => M.subjectStats(s, db, today());

/* ---------- Actions ---------- */
function createTask(o) {
  const t = normTask(o);
  db.tasks.push(t);
  if (!enModif) save();
  return t;
}
function createSubject(o) {
  const s = normSubject(o);
  db.subjects.push(s);
  if (!enModif) save();
  return s;
}
// Libellés des champs, pour l'historique (« Échéance : « Tâche » »)
const CHAMP = { title: 'Titre', subjectId: 'Sujet', status: 'État', progress: 'Avancement', deadline: 'Échéance', startDate: 'Date de début',
  estimate: 'Temps estimé', real: 'Temps réel', planMode: 'Répartition', planDaily: 'Répartition', notes: 'Notes',
  's-title': 'Titre du sujet', 's-priority': 'Priorité', 's-desc': 'Description', 's-parent': 'Sujet parent',
  's-dim-code': 'Code', 's-dim-secteur': 'Secteur', 's-dim-produit': 'Produit fini' };
// Modifie un champ d'une tâche (règle dans metier.js) ; une saisie refusée affiche son message
function setTaskField(t, f, v) {
  const r = M.setTaskField(t, f, v, db);
  if (typeof r === 'string') { toast(r); return false; }
  return r;
}
function setSubjectField(s, f, v) {
  if (f === 's-parent') {
    if (setParent(s, v)) return true;
    if (v !== (s.parentId || '')) toast('Ce sujet ne peut pas être rangé là (un seul niveau de sous-sujets)');
    return false;
  }
  if (f === 's-title') s.title = v.trim();
  else if (f === 's-priority') s.priority = +v;
  else if (f === 's-desc') s.description = v;
  else if (f.startsWith('s-dim-') && DIMS[f.slice(6)]) s[f.slice(6)] = v.trim();
  else return false;
  return true;
}
function archiveTask(t, on = true) {
  t.archived = on; t.archivedAt = on ? nowIso() : null;
}
function archiveSubject(s, on = true) {
  // Les sous-sujets suivent leur parent ; ceux archivés avant restent archivés à la restauration
  childrenOf(s, true).forEach(c => {
    if (on && !c.archived) { c.archivedWithParent = true; c.archived = true; c.archivedAt = nowIso(); }
    else if (!on && c.archivedWithParent) { c.archivedWithParent = false; c.archived = false; c.archivedAt = null; }
  });
  s.archived = on; s.archivedAt = on ? nowIso() : null;
  if (!on) s.archivedWithParent = false;
}

/* ---------- Toast ---------- */
let toastTimer;
// action : fonction du bouton (« Annuler » par défaut, ou « Rétablir »)
function toast(msg, action, label = 'Annuler') {
  const el = $('#toast');
  el.innerHTML = `<div class="toast" role="status" aria-live="polite"><span>${esc(msg)}</span>${action ? `<button data-act="undo">${esc(label)}</button>` : ''}</div>`;
  el._undo = action || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ''; el._undo = null; }, action ? 6000 : 3500);
}

/* ---------- Point unique de modification et historique (Annuler / Rétablir) ---------- */
// Toute modification des données passe par modifier(libellé, fn, options) : photo avant, modification,
// date « modifiée le » sur ce qui a changé, enregistrement, affichage, entrée dans l'historique, bandeau.
// options : toast (texte du bandeau, sinon pas de bandeau sauf annuler), annuler (bouton « Annuler » dans le bandeau),
//   differe (réaffichage qui garde le focus, pour la frappe), copie (garde la copie « avant import »), lieu ({ vue, tid, sid }),
//   historique: false (conséquence d'un réglage, qui ne doit pas s'annuler : l'historique est alors vidé).
// Le libellé peut être une fonction, lue après la modification (titre qu'on vient de changer).

];

// Re-rendu différé qui garde le focus et le curseur sur le même champ
let renderPending = false;
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  setTimeout(() => {
    renderPending = false;
    const a = document.activeElement;
    const k = a && a.dataset && a.dataset.k;
    let sel = null;
    try { if (k && a.selectionStart != null) sel = [a.selectionStart, a.selectionEnd]; } catch (e) {}
    render();
    if (k) {
      const el = document.querySelector(`[data-k="${CSS.escape(k)}"]`);
      if (el) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
    }
  }, 0);
}
function applyTheme() {
  const t = db.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
function focusKey(k, select) {
  setTimeout(() => {
    const el = document.querySelector(`[data-k="${CSS.escape(k)}"]`);
    if (el) { el.focus(); if (select && el.select) el.select(); }
  }, 0);
}

/* ---------- Événements ---------- */
// Champs date tapés au clavier : le navigateur émet « change » dès qu'une date est complète en cours de frappe
// (ex. année 0002), et le re-rendu remettait le curseur au début. On garde ces « change » jusqu'à Entrée ou la sortie du champ.
// Un choix au calendrier (sans frappe) passe tout de suite. (document.activeElement n'est pas fiable ici : Chromium le met
// parfois sur body quand le curseur passe d'une partie de la date à l'autre.)
const dateTyping = new WeakSet(), datePending = new WeakSet();
const isDateInput = el => el && el.tagName === 'INPUT' && el.type === 'date';
function flushDate(el) {
  if (!datePending.has(el)) return;
  datePending.delete(el); dateTyping.delete(el);
  el.dispatchEvent(new Event('change', { bubbles: true }));
}
document.addEventListener('keydown', e => {
  const el = e.target;
  if (!isDateInput(el)) return;
  if (e.key === 'Enter') flushDate(el);
  else if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete' || e.key === 'ArrowUp' || e.key === 'ArrowDown') dateTyping.add(el);
}, true);
document.addEventListener('change', e => {
  const el = e.target;
  if (isDateInput(el) && e.isTrusted && dateTyping.has(el)) { datePending.add(el); e.stopImmediatePropagation(); }
}, true);
document.addEventListener('focusout', e => { if (isDateInput(e.target)) { flushDate(e.target); dateTyping.delete(e.target); } }, true);

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.mod) {
    const m = MODULES.find(x => x.id === el.dataset.mod);
    if (!m || m.soon) return;
    db.settings.modules[m.id] = el.checked;
    save();
    window.dispatchEvent(new CustomEvent('todo:modules', { detail: { id: m.id, on: el.checked } }));
    render();
    focusKey('mod-' + m.id);
    toast(`${m.label} : ${el.checked ? 'activé' : 'masqué (rien n\'est supprimé)'}`);
    return;
  }
  const f = el.dataset.field;
  if (f) {
    const tr = el.closest('[data-tid]');
    if (tr && !f.startsWith('s-')) {
      const t = task(tr.dataset.tid);
      if (t) modifier(() => `${CHAMP[f] || 'Tâche modifiée'} : « ${t.title || 'Sans titre'} »`, () => setTaskField(t, f, el.value), { differe: true });
      return;
    }
    const sr = el.closest('[data-sid]');
    if (sr) {
      const s = subj(sr.dataset.sid);
      if (s) modifier(() => `${CHAMP[f] || 'Sujet modifié'} : « ${s.title || 'Sans titre'} »`, () => setSubjectField(s, f, el.value), { differe: true });
    }
    return;
  }
  if (el.dataset.dim) { db.ui.dims[el.dataset.dim] = el.value; save(); render(); return; }
  if (el.id === 'qa-subject') qaState.subject = el.value;
  if (el.id === 'qa-date') { qaState.date = el.value; scheduleRender(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'search') { db.ui.search = e.target.value; scheduleRender(); }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'qa') return;
  e.preventDefault();
  const title = $('#qa-title').value.trim();
  if (!title) return;
  const subjectId = $('#qa-subject').value || null;
  const deadline = $('#qa-date').value || null;
  qaState.subject = subjectId || '';
  modifier(`Tâche ajoutée : « ${title} »`, () => { createTask({ title, subjectId, deadline }); },
    { toast: `Tâche ajoutée${subjectId ? ' dans « ' + subj(subjectId).title + ' »' : ' dans la boîte de réception'}` });
  focusKey('qa-title');
});

document.addEventListener('keydown', e => {
  const el = e.target;
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  if (e.key === 'Escape') {
    if (el.classList && el.classList.contains('inline')) { el.value = el.defaultValue; el.blur(); return; }
    if (drawerId) { drawerId = null; renderDrawer(); return; }
  }
  if (!inField && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const qa = $('#qa-title');
    if (qa) { e.preventDefault(); qa.focus(); }
    else { e.preventDefault(); location.hash = 'dashboard'; focusKey('qa-title'); }
    return;
  }
  if (e.key !== 'Enter' || !inField) return;
  if (el.dataset.add) {
    e.preventDefault();
    const sid = el.dataset.add;
    const title = el.value.trim();
    if (!title) return;
    const estEl = document.querySelector(`[data-add-est="${sid}"]`);
    const dateEl = document.querySelector(`[data-add-date="${sid}"]`);
    let est = parseDur(estEl ? estEl.value : '');
    if (Number.isNaN(est)) { toast('Durée non comprise. Exemples : 1h30, 45min, 2 (heures)'); return; }
    modifier(`Tâche ajoutée : « ${title} »`, () => { createTask({ title, subjectId: sid, deadline: (dateEl && dateEl.value) || null, estimateMin: est }); });
    focusKey('add-' + sid);
    return;
  }
  if (el.dataset.addEst || el.dataset.addDate) {
    e.preventDefault();
    const sid = el.dataset.addEst || el.dataset.addDate;
    const ti = document.querySelector(`[data-add="${sid}"]`);
    if (ti) ti.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    return;
  }
  if (el.tagName === 'INPUT' && (el.classList.contains('inline') || el.closest('.drawer'))) { e.preventDefault(); el.blur(); }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.sec) dashOpen[d.dataset.sec] = d.open;
}, true);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  const tid = b.closest('[data-tid]')?.dataset.tid;
  const sid = b.closest('[data-sid]')?.dataset.sid;
  const t = tid && task(tid);
  const s = sid && subj(sid);
  switch (act) {
    case 'toggle-done': {
      const fait = t.status !== 'done';
      modifier(`${fait ? 'Tâche faite' : 'Tâche rouverte'} : « ${t.title || 'Sans titre'} »`, () => setTaskField(t, 'status', fait ? 'done' : 'todo'),
        fait ? { differe: true, toast: 'Bravo, tâche faite ✔', annuler: true } : { differe: true });
      break;
    }
    case 'postpone': {
      const base = !t.deadline || t.deadline < today() ? today() : t.deadline;
      const nd = addDays(base, 1);
      modifier(`Tâche reportée : « ${t.title || 'Sans titre'} »`, () => setTaskField(t, 'deadline', nd), { toast: 'Reportée au ' + longDate(nd), annuler: true });
      break;
    }
    case 'archive-task':
      if (drawerId === t.id) drawerId = null;
      modifier(`Tâche archivée : « ${t.title || 'Sans titre'} »`, () => archiveTask(t), { toast: 'Tâche archivée', annuler: true });
      break;
    case 'restore-task': modifier(`Tâche restaurée : « ${t.title || 'Sans titre'} »`, () => archiveTask(t, false), { toast: 'Tâche restaurée' }); break;
    case 'details': drawerId = tid; renderDrawer(); focusKey('dr-title'); break;
    case 'close-drawer': drawerId = null; renderDrawer(); break;
    case 'toggle-subject': {
      const ex = new Set(db.ui.expanded);
      ex.has(sid) ? ex.delete(sid) : ex.add(sid);
      db.ui.expanded = [...ex]; save(); render();
      break;
    }
    case 'expand-all': db.ui.expanded = activeSubjects().map(x => x.id); save(); render(); break;
    case 'collapse-all': db.ui.expanded = []; save(); render(); break;
    case 'toggle-closed': db.ui.showClosed = b.checked; save(); render(); break;
    case 'add-child': {
      if (!s || parentOf(s)) break;
      let ns;
      modifier(`Sous-sujet créé dans « ${s.title || 'Sans titre'} »`, () => {
        ns = createSubject({ title: 'Nouveau sous-sujet', priority: s.priority, parentId: s.id, code: s.code, secteur: s.secteur, produit: s.produit });
        expandTo(ns.id); db.ui.search = '';
      });
      focusKey('st-' + ns.id, true);
      break;
    }
    case 'to-subject': {
      if (!t) break;
      const from = subj(t.subjectId);
      // Profondeur 1 : la tâche d'un sous-sujet donne un frère ; un parent archivé ne reçoit rien
      const parent = !from || from.archived ? null : !from.parentId ? from : !isTop(from) ? parentOf(from) : null;
      const titre = t.title || 'Nouveau sujet';
      drawerId = null;
      modifier(`Tâche transformée en sujet : « ${titre} »`, () => {
        const ns = createSubject({ title: titre, priority: from ? from.priority : 3, parentId: parent ? parent.id : null,
          code: from ? from.code : '', secteur: from ? from.secteur : '', produit: from ? from.produit : '' });
        t.subjectId = ns.id;
        expandTo(ns.id);
      }, { toast: parent ? `Sous-sujet « ${titre} » créé dans « ${parent.title} »` : `Sujet « ${titre} » créé`, annuler: true });
      if (currentView() !== 'sujets') location.hash = 'sujets';
      break;
    }
    case 'add-subject': {
      let ns;
      modifier('Sujet créé', () => { ns = createSubject({ title: 'Nouveau sujet', priority: 3 }); db.ui.expanded.push(ns.id); db.ui.search = ''; });
      focusKey('st-' + ns.id, true);
      break;
    }
    case 'archive-subject': {
      const st = subjectStats(s);
      if (st.open && !confirm(`Le sujet « ${s.title} » a encore ${st.open} tâche(s) ouverte(s). Archiver quand même ?`)) return;
      modifier(`Sujet archivé : « ${s.title || 'Sans titre'} »`, () => archiveSubject(s), { toast: 'Sujet archivé', annuler: true });
      break;
    }
    case 'archive-closed': {
      const list = db.tasks.filter(x => x.subjectId === sid && !x.archived && !isOpen(x));
      modifier(`${list.length} tâche(s) archivée(s)`, () => list.forEach(x => archiveTask(x)), { toast: `${list.length} tâche(s) archivée(s)`, annuler: true });
      break;
    }
    case 'restore-subject': modifier(`Sujet restauré : « ${s.title || 'Sans titre'} »`, () => archiveSubject(s, false), { toast: 'Sujet restauré' }); break;
    case 'qa-date': {
      const d = addDays(today(), +b.dataset.d);
      qaState.date = qaState.date === d ? '' : d;
      const ttl = $('#qa-title').value;
      render(); $('#qa-title').value = ttl; focusKey('qa-title');
      break;
    }
    case 'filters-toggle': db.ui.filtersOpen = !db.ui.filtersOpen; save(); render(); break;
    case 'goto-sec': {
      const k = b.dataset.sec, d = document.querySelector(`details[data-sec="${k}"]`);
      if (!d) break;
      d.open = true; dashOpen[k] = true;
      d.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      break;
    }
    case 'theme': db.settings.theme = b.dataset.v; save(); render(); break;
    case 'undo': { const u = $('#toast')._undo; $('#toast').innerHTML = ''; $('#toast')._undo = null; if (u) u(); break; }
    case 'hist-undo': annuler(); break;
    case 'hist-redo': retablir(); break;
    case 'export': exportJson(); break;
    case 'demo-start': startDemo(); break;
    case 'demo-exit': exitDemo(); break;
    case 'demo-reset':
      if (confirm("Remettre les données d'exemple de départ ?")) { db = demoData(); dropBackup(); viderHistorique(); save(); render(); toast('Exemple remis à zéro'); }
      break;
    case 'import': $('#file').click(); break;
    case 'undo-import': {
      const bk = store.getItem(BACKUP_KEY);
      if (!bk) break;
      let old;
      try { old = JSON.parse(bk); } catch (e) { alert('Copie illisible.'); break; }
      const at = store.getItem(BACKUP_KEY + '-date');
      if (confirm(`Revenir à l'état d'avant le dernier import${at ? ' (copie du ' + new Date(at).toLocaleString('fr-FR') + ')' : ''} ?\n\n` +
        `Cette copie : ${(old.subjects || []).length} sujets, ${(old.tasks || []).length} tâches\nActuellement : ${db.subjects.length} sujets, ${db.tasks.length} tâches\n\n` +
        `L'état actuel est gardé à sa place : tu pourras y revenir avec le même bouton.`)) {
        // Échange : l'état actuel devient la copie, pour pouvoir annuler ce retour
        const ui = db.ui;
        keepBackup();
        db = migrate(old); db.ui = ui; viderHistorique(); save(); render(); toast('État précédent restauré');
      }
      break;
    }
    case 'dims-clear': db.ui.dims = { code: '', secteur: '', produit: '' }; save(); render(); break;
  }
});

window.addEventListener('hashchange', () => { db.ui.search = ''; render(); window.scrollTo(0, 0); });

/* ---------- Export / import ---------- */
function exportJson() {
  db.settings.lastExport = nowIso();
  save();
  const blob = new Blob([JSON.stringify(Object.assign({ exportedAt: nowIso() }, db), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `todo-sauvegarde-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  render();
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.subjects) || !Array.isArray(d.tasks)) throw new Error("ce n'est pas une sauvegarde de cette appli");
    if (!confirm(`Remplacer les données actuelles (${db.subjects.length} sujets, ${db.tasks.length} tâches) par celles du fichier (${d.subjects.length} sujets, ${d.tasks.length} tâches) ?`)) return;
    keepBackup();
    delete d.exportedAt;
    db = migrate(d);
    viderHistorique(); save(); render();
    toast('Import terminé');
  } catch (err) {
    alert('Import impossible : ' + err.message);
  }
});

// Accès pour les modules séparés (sauvegarde auto, chrono, charge…)
window.todoApp = {
  getData: () => db,
  today,
  render: () => render(),
  demo: DEMO,
  replaceData: d => { keepBackup(); db = migrate(d); viderHistorique(); save(); render(); }
};
// Points d'accroche pour chrono-charge.js (chrono, temps réel, vue Charge)
const hooks = { taskRow: [], drawer: [], dashFilter: [dimOk], dashTop: [], subjectsToolbar: [], dayOff: [], subjectBody: [] };
Object.assign(window.todoApp, { hooks, views, NAV, ICON, MODULES, modOn, PRIO, STATUS, DIMS, dimOk, dimsBar, save, modifier, annuler, retablir, scheduleRender, task, subj, visible, isOpen, setTaskField, toast, subjectStats, remaining: M.remaining, taskCmp,
  parentOf, childrenOf, subjLabel, setParent, canNest, expandTo, archiveSubject, createSubject,
  esc, uid, nowIso, ymd, addDays, diffDays, parseYmd, longDate, fmtDur, parseDur });

if (DEMO) {
  document.body.classList.add('demo');
  $('#demo-bar').hidden = false;
  document.title = 'Démo · ' + document.title;
}
// Version installable (écran d'accueil du téléphone) : uniquement en ligne, pas en file://
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

render();
// Rafraîchit les libellés (retard, aujourd'hui…) quand on change de jour
let day = today();
setInterval(() => { if (today() !== day) { day = today(); render(); } }, 60000);
})();
